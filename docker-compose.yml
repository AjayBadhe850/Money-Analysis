version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension enabled
  postgres:
    image: pgvector/pgvector:pg16
    container_name: money_analysis_postgres
    restart: always
    environment:
      POSTGRES_DB: money_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_analysis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cloud / Local In-Memory Store & Task Broker
  redis:
    image: redis:7-alpine
    container_name: money_analysis_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: money_analysis_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/money_analysis_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: money_analysis_production_super_secret_jwt_key_2026
      STAGE: 3
      ENABLE_AI_AGENTS: "true"
      LLM_PROVIDER: mock
      RATE_LIMIT_PER_MINUTE: 120
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"

  # 4. Celery Background Worker & Beat Scheduler
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: money_analysis_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/money_analysis_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: money_analysis_production_super_secret_jwt_key_2026
      STAGE: 3

  # 5. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: money_analysis_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
